name: HighCountry standalone source independence L1 L2
on:
  pull_request:
    paths:
      - 'apps/highcountry-web/**'
      - 'services/highcountry-*/**'
      - 'scripts/consolidation/**'
      - 'scripts/highcountry/**'
      - 'deployments/highcountry/**'
      - 'tools/tiled/**'
      - '.github/workflows/hc-consolidate-integration-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: L1 local module and authority boundaries
        run: |
          node --test scripts/consolidation/module-dependency-audit.test.mjs scripts/consolidation/integration-boundaries.test.mjs
          node --check apps/highcountry-web/server.mjs
          node --check services/highcountry-economy/src/start-runtime.js
      - name: L2 standalone static build without Genesis clone
        run: |
          node apps/highcountry-web/scripts/build.mjs
          test -s apps/highcountry-web/dist/index.html
          test -f apps/highcountry-web/dist/src/old-town-scene.js
          test -f apps/highcountry-web/dist/assets/highcountry/maps/old-town-site-registry.json
          test -f apps/highcountry-web/dist/assets/highcountry/maps/hc-world-map-catalogue.v1.json
      - name: No source dependency on Genesis repository
        run: |
          if grep -R -n -E 'git clone.*420-integrated-v0\\.1|GENESIS_CHECKOUT|git -C .*highcountry-genesis' .github/workflows/hc-consolidate-integration-targeted.yml; then
            echo 'Genesis checkout dependency is prohibited'; exit 1
          fi
