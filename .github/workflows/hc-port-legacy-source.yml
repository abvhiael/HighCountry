name: Stage missing HighCountry-owned source from historical Genesis PRs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/highcountry/port-legacy-missing-source.mjs
      - .github/workflows/hc-port-legacy-source.yml
jobs:
  stage-missing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select and stage only absent game-owned authored files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/highcountry/port-legacy-missing-source.mjs
