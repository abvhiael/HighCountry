name: HighCountry game-owned contract source migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hc-port-game-contract-source.yml
jobs:
  stage-game-owned-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Fetch canonical Genesis game-only Solidity source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/abvhiael/420-integrated-v0.1.git /tmp/hc-genesis
          git -C /tmp/hc-genesis sparse-checkout set contracts/src/highcountry contracts/test/highcountry
          test -d /tmp/hc-genesis/contracts/src/highcountry
          test -d /tmp/hc-genesis/contracts/test/highcountry
      - name: Stage missing standalone game-owned source without overwriting qualified code
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git -C /tmp/hc-genesis rev-parse HEAD)
          git switch -c migration/highcountry-contract-source-20261122
          mkdir -p contracts/src/highcountry contracts/test/highcountry
          cp -an /tmp/hc-genesis/contracts/src/highcountry/. contracts/src/highcountry/
          cp -an /tmp/hc-genesis/contracts/test/highcountry/. contracts/test/highcountry/
          total_source=$(find /tmp/hc-genesis/contracts/src/highcountry /tmp/hc-genesis/contracts/test/highcountry -type f | wc -l)
          total_staged=$(find contracts/src/highcountry contracts/test/highcountry -type f | wc -l)
          test "$total_source" -ge 170
          test "$total_staged" -ge 170
          printf 'Genesis snapshot: %s\nGame-owned source files: %s\nStaged source files: %s\n' "$source_sha" "$total_source" "$total_staged"
          for path in $(find /tmp/hc-genesis/contracts/src/highcountry /tmp/hc-genesis/contracts/test/highcountry -type f | sed 's#^/tmp/hc-genesis/##'); do
            cmp "/tmp/hc-genesis/$path" "$path" || { echo "source mismatch: $path"; exit 1; }
          done
          git add contracts/src/highcountry contracts/test/highcountry
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve canonical HighCountry-owned Solidity contracts and tests from Genesis $source_sha"
          git push -u origin HEAD
