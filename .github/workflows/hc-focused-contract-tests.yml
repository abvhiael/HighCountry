name: HighCountry focused standalone Solidity qualification
on:
  pull_request:
    paths:
      - contracts/**
      - scripts/highcountry/prepare-focused-contract-test.mjs
      - .github/workflows/hc-focused-contract-tests.yml
  push:
    branches:
      - main
      - migration/highcountry-contract-source-20261122
    paths:
      - contracts/**
      - scripts/highcountry/prepare-focused-contract-test.mjs
      - .github/workflows/hc-focused-contract-tests.yml
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test:
          - test/highcountry/unit/equipment/EquipmentRegistry.t.sol
          - test/highcountry/unit/equipment/EquipmentClassCatalogueV1.t.sol
          - test/highcountry/unit/market/CanonicalMarketEscrow.t.sol
          - test/highcountry/unit/security/R0414Authority.t.sol
          - test/highcountry/unit/manufacturing/ManufacturingEngine.t.sol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abvhiael/420-integrated-v0.1
          ref: f5072ae8d343aca4731e02b774c41394b4228d69
          path: _genesis
          sparse-checkout: |
            contracts/src
            contracts/test/helpers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Hydrate exact Genesis-owned shared dependency revision
        run: node scripts/highcountry/hydrate-genesis-shared-contracts.mjs _genesis
      - name: Stage dependency-closed contract test
        env:
          TEST_PATH: ${{ matrix.test }}
        run: node scripts/highcountry/prepare-focused-contract-test.mjs "$TEST_PATH"
      - name: Run on-chain contract unit test under Foundry
        run: forge test --root /tmp/highcountry-focused-foundry --fuzz-runs 256 -vv
