name: Retire safely merged HighCountry migration branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hc-retire-merged-migration-branches.yml'
  workflow_dispatch:
jobs:
  retire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PR merges and shared ref safety before deleting old migration heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/highcountry/retire-merged-migration-branches.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: highcountry-merged-migration-branch-audit
          path: highcountry-merged-migration-branches.json
          if-no-files-found: error
          retention-days: 90
