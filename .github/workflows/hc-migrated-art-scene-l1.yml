name: HighCountry migrated art and scene contracts L1
on:
  pull_request:
    paths:
      - 'apps/highcountry-web/src/textile-catalogue.js'
      - 'apps/highcountry-web/test/textile-catalogue.test.js'
      - 'apps/highcountry-web/src/cultivation-scene-layout.js'
      - 'apps/highcountry-web/test/hc-gfx-214-layout.test.mjs'
      - 'apps/highcountry-web/src/marketplace.js'
      - 'apps/highcountry-web/src/app.js'
      - 'apps/highcountry-web/public/styles.css'
      - 'apps/highcountry-web/scripts/build.mjs'
      - 'apps/highcountry-web/test/hc-next-4-4-marketplace.test.mjs'
      - '.github/workflows/hc-migrated-art-scene-l1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/highcountry-web/src/textile-catalogue.js'
      - 'apps/highcountry-web/test/textile-catalogue.test.js'
      - 'apps/highcountry-web/src/cultivation-scene-layout.js'
      - 'apps/highcountry-web/test/hc-gfx-214-layout.test.mjs'
      - 'apps/highcountry-web/src/marketplace.js'
      - 'apps/highcountry-web/src/app.js'
      - 'apps/highcountry-web/public/styles.css'
      - 'apps/highcountry-web/scripts/build.mjs'
      - 'apps/highcountry-web/test/hc-next-4-4-marketplace.test.mjs'
      - '.github/workflows/hc-migrated-art-scene-l1.yml'
  workflow_dispatch:
jobs:
  migrated-art-scene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax check
        run: node --check apps/highcountry-web/src/marketplace.js && node --check apps/highcountry-web/src/cultivation-scene-layout.js && node --check apps/highcountry-web/src/textile-catalogue.js
      - name: Migrated textile and scene tests
        run: node --test apps/highcountry-web/test/textile-catalogue.test.js apps/highcountry-web/test/hc-gfx-214-layout.test.mjs apps/highcountry-web/test/old-town-scene.test.mjs apps/highcountry-web/test/red-mesa-heritage-review-catalogue.test.mjs apps/highcountry-web/test/red-mesa-leisure-catalogue.test.mjs services/highcountry-economy/test/placement-canonical-rectangles.test.mjs apps/highcountry-web/test/agricultural-building-catalogue.test.mjs apps/highcountry-web/test/entertainment-catalogue.test.mjs apps/highcountry-web/test/poster-catalogue.test.mjs apps/highcountry-web/test/signs-plaques-catalogue.test.mjs apps/highcountry-web/test/framed-art-catalogue.test.mjs apps/highcountry-web/test/mounted-decor-catalogue.test.mjs apps/highcountry-web/test/small-decor-catalogue.test.mjs apps/highcountry-web/test/fire-gathering-catalogue.test.mjs apps/highcountry-web/test/garden-ornament-catalogue.test.mjs apps/highcountry-web/test/landscape-catalogue.test.mjs apps/highcountry-web/test/recreation-catalogue.test.mjs apps/highcountry-web/test/hc-next-4-4-marketplace.test.mjs
      - name: Qualify Old Town landmarks and Port Alder navigation against retained authority
        run: node --test scripts/highcountry/hc-world-pa-oldtown-landmarks.test.mjs scripts/highcountry/hc-world-port-alder-map-stage.test.mjs scripts/highcountry/hc-world-port-alder-milestone-authority.test.mjs
      - name: Bundle all migrated marketplace modules and public assets
        run: node apps/highcountry-web/scripts/build.mjs
