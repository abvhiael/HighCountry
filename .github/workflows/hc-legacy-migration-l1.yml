name: HighCountry legacy migration application and economy L1
on:
  pull_request:
    paths:
      - 'apps/highcountry-web/src/**'
      - 'apps/highcountry-web/test/**'
      - 'services/highcountry-economy/**'
      - '.github/workflows/hc-legacy-migration-l1.yml'
  push:
    branches:
      - migration/highcountry-legacy-source-20261122
    paths:
      - 'apps/highcountry-web/src/**'
      - 'apps/highcountry-web/test/**'
      - 'services/highcountry-economy/**'
      - '.github/workflows/hc-legacy-migration-l1.yml'
  workflow_dispatch:
jobs:
  game-catalogues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test migrated furniture and catalogues
        run: node --test apps/highcountry-web/test/hc-art-01a-catalog.test.mjs apps/highcountry-web/test/hc-art-02-furniture.test.mjs apps/highcountry-web/test/hc-art-02b-greenhouse-lounge.test.mjs apps/highcountry-web/test/hc-art-02c-outdoor-seating.test.mjs apps/highcountry-web/test/hc-art-02d-tables-desks.test.mjs
  service-indexer-missions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned economy dependencies
        run: npm ci --prefix services/highcountry-economy --ignore-scripts
      - name: Test migrated canonical indexer and missions
        run: node --test services/highcountry-economy/test/canonical-http-indexer.test.js services/highcountry-economy/test/canonical-indexer-reconciler.test.js services/highcountry-economy/test/missions-http.test.js services/highcountry-economy/test/signed-mission-evidence.test.js
