name: Reconcile HighCountry legacy migration branch with current standalone main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hc-reconcile-legacy-pr.yml
jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/highcountry-legacy-source-20261122
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main without discarding retained marketplace logic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                apps/highcountry-web/src/marketplace.js|apps/highcountry-web/scripts/build.mjs)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *) echo "Unreviewed merge conflict: $path" >&2; exit 1;;
              esac
            done
            git diff --name-only --diff-filter=U | grep . && { echo "Unresolved conflict"; exit 1; } || true
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Reconcile migrated HighCountry-owned source with latest standalone main"
          fi
          git push origin HEAD:migration/highcountry-legacy-source-20261122
