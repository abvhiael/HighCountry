name: HighCountry standalone pinned contract dependency qualification
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/highcountry/hydrate-genesis-shared-contracts.mjs'
      - '.github/workflows/hc-game-contract-deps.yml'
  push:
    branches:
      - migration/highcountry-contract-source-20261122
    paths:
      - 'contracts/**'
      - 'scripts/highcountry/hydrate-genesis-shared-contracts.mjs'
      - '.github/workflows/hc-game-contract-deps.yml'
  workflow_dispatch:
jobs:
  dependency-qualification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abvhiael/420-integrated-v0.1
          ref: f5072ae8d343aca4731e02b774c41394b4228d69
          path: _genesis
          sparse-checkout: |
            contracts/src
            contracts/test/helpers
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hydrate externally owned Genesis dependencies into ephemeral CI workspace
        run: node scripts/highcountry/hydrate-genesis-shared-contracts.mjs _genesis
      - name: Verify standalone HighCountry and pinned shared import graph
        run: node scripts/highcountry/verify-game-contract-dependencies.mjs
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Configure isolated game-contract Solidity compilation
        run: |
          cat > contracts/foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          cache_path = "cache"
          solc_version = "0.8.24"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          ffi = false
          fuzz = { runs = 256, max_test_rejects = 65536, seed = "0x420" }
          TOML
      - name: Compile and exercise migrated EquipmentRegistry unit tests
        run: forge test --root contracts --match-path 'test/highcountry/unit/equipment/EquipmentRegistry.t.sol' --fuzz-runs 256 -vv
