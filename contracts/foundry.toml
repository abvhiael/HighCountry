[profile.default]
src = "src/highcountry"
test = "test/highcountry"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fuzz = { runs = 256, max_test_rejects = 65536, seed = "0x420" }

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 65536, seed = "0x420" }

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = true
